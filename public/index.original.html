<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LLM Chat</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161922;
    --panel-2: #1d212c;
    --border: #2a2f3a;
    --text: #e4e6eb;
    --text-dim: #9aa0ac;
    --accent: #5b8cff;
    --accent-dim: #3a5bb0;
    --user-bubble: #2b3650;
    --assistant-bubble: #1d212c;
    --danger: #e5534b;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    height: 100vh;
    overflow: hidden;
  }
  #sidebar {
    width: 260px;
    flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
  }
  /* (original file backed up) */
</style>
</head>
<body>
  <aside id="sidebar"></aside>
  <main id="main"></main>
</body>
</html>
